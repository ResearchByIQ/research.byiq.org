<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Inevitable Systems">
  <title>Inevitable Systems</title>
  <defs>
    <linearGradient id="isAccent" x1="20" y1="20" x2="72" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c3bafd"/>
      <stop offset="0.55" stop-color="#9184d9"/>
      <stop offset="1" stop-color="#6d5fb0"/>
    </linearGradient>
  </defs>
  <!-- Reduction converging to an inevitable point: three narrowing strokes collapse to one node -->
  <g fill="none" stroke="url(#isAccent)" stroke-width="8.5" stroke-linecap="round">
    <line x1="21" y1="27" x2="79" y2="27"/>
    <line x1="31" y1="45" x2="69" y2="45"/>
    <line x1="41" y1="63" x2="59" y2="63"/>
  </g>
  <circle cx="50" cy="81" r="6.5" fill="url(#isAccent)"/>
</svg>